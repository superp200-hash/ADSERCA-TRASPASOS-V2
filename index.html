<head>

<title>TRASPASOS TIENDA V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{width:100%;max-width:none;margin:auto;padding:10px 12px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h1{margin:0 0 5px;font-size:25px}.muted{color:#667085}.clock{font-size:18px;font-weight:700;margin:12px 0}
.pickers{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:10px;align-items:start;width:100%}.arrow{font-size:34px;font-weight:800;text-align:center;margin-top:60px}
h2{font-size:14px;margin:8px 0 9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
button{min-height:48px;border-radius:11px;border:1px solid #d0d5dd;background:#fff;font-weight:700;padding:8px;cursor:pointer}
button.selected{background:#17202a;color:#fff;border-color:#17202a}
.result{margin-top:16px;padding:15px;border-radius:14px;background:#f7f8fa}.big{font-size:25px;font-weight:800;margin-bottom:10px}
.warn{margin-top:12px;padding:12px;border-left:4px solid #f59e0b;background:#fff5df;border-radius:8px}.error{margin-top:12px;padding:12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px}
.steps{margin-top:10px}.step{padding:9px 0;border-bottom:1px solid #e7e9ec}.step:last-child{border:0}
.chain{font-weight:800;font-size:17px;line-height:1.5}.meta{font-size:14px;color:#667085;margin-top:4px}.incident{margin-top:10px;padding:10px 12px;border-left:4px solid #d92d20;background:#fff0ef;border-radius:8px;font-size:14px}
.testbox{margin-top:16px}.testbox summary{cursor:pointer;font-weight:800}.incident-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.incident-item{padding:10px 12px;background:#fff5df;border-left:4px solid #f59e0b;border-radius:8px}.small{font-size:13px;color:#667085}
@media(max-width:900px){main{padding:8px}.grid{gap:6px}}
@media(max-width:650px){.pickers{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:6px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

const INCIDENTS=[
{route:"R04B",stores:["ELCHE CARRUS","ELCHE SECTOR"],label:"11 ELCHE CARRUS ↔ 14 ELCHE SECTOR",detail:"INCIDENCIA — recorrido exclusivo 11 ↔ 14; servicios incompletos por sentido."},
{route:"R08",stores:["IBI","ALCOY","ATALAYAS"],label:"30 IBI → ALCOY / 30 IBI → 00 ATALAYAS",detail:"INCIDENCIA — servicio de las 11:25 marcado para comprobación; no se usa en el cálculo activo."},
{route:"R11",stores:["ATALAYAS","HELLIN"],label:"00 ATALAYAS → 28 HELLIN",detail:"INCIDENCIA — falta el tramo 00 → HELLIN en la fuente."},
{route:"R12",stores:["VILLARROBLEDO","ALBACETE","ATALAYAS"],label:"19 VILLARROBLEDO",detail:"INCIDENCIA — solo existe comunicación VILLARROBLEDO → ALBACETE → 00; falta el sentido de retorno."},
{route:"R13",stores:["LA RODA","VILLARROBLEDO","ALBACETE","ATALAYAS"],label:"27 LA RODA",detail:"INCIDENCIA — solo existe LA RODA → VILLARROBLEDO → ALBACETE → 00; falta el sentido de retorno."},
{route:"R14",stores:["CUENCA","ALBACETE","ATALAYAS"],label:"18 CUENCA",detail:"INCIDENCIA — solo existe CUENCA → ALBACETE → 00; falta el sentido de retorno."},
{route:"R15",stores:["TARANCON","ALBACETE","ATALAYAS"],label:"20 TARANCON",detail:"INCIDENCIA — solo existe TARANCON → ALBACETE → 00; falta el sentido de retorno."},
{route:"R16",stores:["DENIA","ONDARA"],label:"26 DENIA ↔ 15 ONDARA",detail:"INCIDENCIA — existe DENIA → ONDARA; falta ONDARA → DENIA."},
{route:"R10",stores:["CALPE","ONDARA","BENIDORM","ATALAYAS"],label:"21 CALPE → 15 ONDARA / 15 ONDARA → 03 BENIDORM / 03 BENIDORM → 00 ATALAYAS",detail:"INCIDENCIA — los huecos X de la fuente no se incorporan."},
 {route:"R17",stores:["JAVEA","ONDARA"],label:"25 JÁVEA ↔ 15 ONDARA",detail:"Ruta cerrada exclusivamente entre Jávea y Ondara. La conexión con 00 Atalayas se realiza a través de Ondara."}
];
let origin="",destination="";
function min(s){let m=String(s).match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}
function fmt(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function edge(e, earliest){const dep=min(e[3]),arr=min(e[4]);let base=Math.floor(earliest/1440)*1440;let depAbs=base+dep;if(depAbs<earliest)depAbs+=1440;let dur=((arr-dep)+1440)%1440;let arrAbs=depAbs+dur; if(String(e[4]).includes("D/S")) arrAbs=Math.max(arrAbs,depAbs)+0; return {dep:depAbs,arr:arrAbs,edge:e}}
function findEarliest(from,to,start,firstLeg){
  const dist={}; const prev={}; const used=new Set(); STORES.forEach(s=>dist[s]=Infinity);
  dist[from]=start;
  while(true){let u=null,b=Infinity;for(const s of STORES){if(!used.has(s)&&dist[s]<b){b=dist[s];u=s}}if(u===null||u===to)break;used.add(u);
    for(const e of LEGS){if(e[1]!==u)continue; if(firstLeg && e!==firstLeg)continue; const z=edge(e,dist[u]); if(z.dep<dist[u])continue; if(z.arr<dist[e[2]]){dist[e[2]]=z.arr;prev[e[2]]={store:u,edge:e,dep:z.dep,arr:z.arr}}}
    if(firstLeg) firstLeg=null;
  }
  if(from===to)return {legs:[],arr:start}; if(!prev[to])return null;
  const legs=[];let cur=to;while(cur!==from){const p=prev[cur];if(!p)return null;legs.unshift(p);cur=p.store}return {legs,arr:dist[to]};
}
function enumerate(from,to){
  if(from===to)return {same:true,paths:[]};
  // Circuito cerrado R17: entre JÁVEA y ONDARA no se permiten desvíos por otras tiendas.
  // Para 25 JÁVEA → 14 ELCHE SECTOR se usan únicamente los servicios directos documentados.
  let allowed=LEGS;
  if((from==='JAVEA'&&to==='ONDARA')||(from==='ONDARA'&&to==='JAVEA')) allowed=LEGS.filter(e=>e[0]==='R17');
  else if(from==='JAVEA'&&to==='ELCHE SECTOR') allowed=LEGS.filter(e=>e[0]==='R17B'&&e[1]==='JAVEA'&&e[2]==='ELCHE SECTOR');
  else if(from==='ELCHE SECTOR'&&to==='JAVEA') allowed=LEGS.filter(e=>e[0]==='R17C'&&e[1]==='ELCHE SECTOR'&&e[2]==='JAVEA');
  const firsts=allowed.filter(e=>e[1]===from).sort((a,b)=>min(a[3])-min(b[3]));
  const byDeparture=new Map();
  for(const f of firsts){
    const dep=min(f[3]); let arr=min(f[4]);
    // En rutas directas aprobadas, no buscar cadenas alternativas por otros almacenes.
    if((f[0]==='R17'||f[0]==='R17B'||f[0]==='R17C')&&f[2]===to){
      if(arr<dep) arr+=1440;
      const p={legs:[{store:from,edge:f,dep,arr}],arr};
      byDeparture.set(dep,p); continue;
    }
    const p=findEarliest(from,to,dep,f);
    if(!p)continue;
    const d=p.legs[0].dep, prev=byDeparture.get(d);
    if(!prev||p.legs.length<prev.legs.length)byDeparture.set(d,p);
  }
  return {same:false,paths:[...byDeparture.values()].sort((a,b)=>a.legs[0].dep-b.legs[0].dep)};
}
function chainText(p){return p.legs.map(x=>fmt(x.dep)+(Math.floor(x.dep/1440)>0?" D/S":"")+" → "+fmt(x.arr)+(Math.floor(x.arr/1440)>0?" D/S":"")).join("  |  ")}
function routeText(p){return p.legs.map(x=>DISPLAY_NAMES[x.edge[1]]||x.edge[1]).concat(DISPLAY_NAMES[p.legs[p.legs.length-1].edge[2]]||p.legs[p.legs.length-1].edge[2]).join(" → ")}
function calc(){const out=document.querySelector('#result'); if(!origin||!destination){out.innerHTML='';return} if(origin===destination){out.innerHTML='<div class="result"><div class="big">Mismo almacén.</div></div>';return}
  const r=enumerate(origin,destination); if(!r.paths.length){out.innerHTML='<div class="result"><div class="big">🔴 Sin cadena encontrada</div><div class="incident">No hay un servicio directo o una cadena válida con los horarios cargados.</div></div>';return}
  let s='<div class="result"><div class="big">'+DISPLAY_NAMES[origin]+' → '+DISPLAY_NAMES[destination]+'</div><div class="steps">';
  r.paths.forEach((p,i)=>{s+='<div class="step"><b>Viaje '+(i+1)+'</b><div class="chain">'+chainText(p)+'</div><div class="meta">'+routeText(p)+' · H. pedido: <b>'+p.legs[0].edge[5]+'</b></div></div>'});
  s+='</div></div>';out.innerHTML=s;
}
function buttons(id,type){const box=document.querySelector(id);STORES.forEach(s=>{const b=document.createElement('button');b.type='button';b.dataset.store=s;b.textContent=DISPLAY_NAMES[s]||s;b.onclick=()=>{if(type==='o')origin=s;else destination=s;mark();calc();renderIncidents();renderStoreAlerts()};box.appendChild(b)})}
function mark(){document.querySelectorAll('#orig button').forEach(b=>b.classList.toggle('selected',b.dataset.store===origin));document.querySelectorAll('#dest button').forEach(b=>b.classList.toggle('selected',b.dataset.store===destination))}
function clock(){const d=new Date();document.querySelector('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function renderIncidents(){const selected=[origin,destination].filter(Boolean);const relevant=INCIDENTS.filter(x=>selected.some(s=>x.stores.includes(s)));document.querySelector('#incidents').innerHTML=relevant.length?relevant.map(x=>'<div class="incident-item"><b>'+x.label+'</b><div class="small">'+x.detail+'</div></div>').join(''):''}
function renderStoreAlerts(){const selected=[origin,destination].filter(Boolean);const notes=[];if(selected.includes('JAVEA'))notes.push('⚠️ JÁVEA cierra a las 18:00.');document.querySelector('#store-alerts').innerHTML=notes.length?'<div class="warn">'+notes.join('<br>')+'</div>':''}
buttons('#orig','o');buttons('#dest','d');clock();setInterval(clock,1000);renderIncidents();renderStoreAlerts();
</script>
